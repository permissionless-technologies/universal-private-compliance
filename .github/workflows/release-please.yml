name: Release Please

on:
  push:
    branches: [main]
  # Manual recovery hatch. The publish gates below extend their condition to
  # `github.event_name == 'workflow_dispatch'`, so triggering this workflow
  # by hand republishes whatever versions are currently in package.json
  # against npm (against `main` HEAD, via the `ref: main` checkout below).
  #
  # When to use: a release-please PR merged + tagged, but the publish job
  # subsequently failed (e.g. stale lockfile, npm registry blip). Push a
  # fix to main, then `gh workflow run release-please.yml --ref main`.
  # Re-running the original failed workflow does NOT work for this case
  # because `gh run rerun` reuses the original commit's workflow file,
  # which won't have any subsequent fixes.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      root_release_created: ${{ steps.release.outputs.release_created }}
      whitelist_release_created: ${{ steps.release.outputs['packages/upc-asp-whitelist--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-sdk:
    needs: release-please
    # `workflow_dispatch` is the manual recovery path (see `on:` comment).
    # On normal pushes the release-please action gates this strictly via
    # `root_release_created`.
    if: ${{ needs.release-please.outputs.root_release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      # Check out `main` HEAD rather than the event SHA. The publish jobs
      # need whatever lockfile / package.json state is on main RIGHT NOW,
      # not the SHA that originally triggered the workflow. This matters
      # for re-runs: when a publish fails (e.g. on a stale lockfile that's
      # since been fixed on main), `gh run rerun --failed` would otherwise
      # check out the same broken SHA and fail again. Pinning to `main`
      # ensures a re-run picks up forward fixes.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish with provenance
        run: npm publish --provenance --access public

  publish-asp-whitelist:
    needs: release-please
    # Same recovery-hatch rationale as publish-sdk.
    if: ${{ needs.release-please.outputs.whitelist_release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      # See `publish-sdk` checkout comment — same rationale for re-run
      # safety.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build upc-sdk first (DTS resolution for the workspace dep)
        run: npm run build
      - run: npm run build
        working-directory: packages/upc-asp-whitelist
      - name: Publish with provenance
        run: npm publish --provenance --access public
        working-directory: packages/upc-asp-whitelist
